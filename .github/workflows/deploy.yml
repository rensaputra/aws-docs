name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: deploy-gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-branch
          fetch-depth: 1

      - name: Preserve PR previews
        run: |
          if [ -d "gh-pages-branch" ]; then
            if ls gh-pages-branch/pr-* 1> /dev/null 2>&1; then
              echo "Found PR previews, copying to build directory..."
              cp -r gh-pages-branch/pr-* ./build/
            else
              echo "No PR previews found."
            fi
            rm -rf gh-pages-branch
          else
            echo "gh-pages branch not found, skipping PR preview preservation."
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
